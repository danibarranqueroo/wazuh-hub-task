name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: lint and test (app/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: app/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Pytest
        run: uv run pytest
