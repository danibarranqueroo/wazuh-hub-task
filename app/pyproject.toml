[project]
name = "wazuh-brief"
version = "0.1.0"
description = "Agent Hardening Brief: reads one Wazuh agent's posture through the Wazuh server API and asks Claude what to fix first."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3",
    "fastapi>=0.162",
    "httpx>=0.28",
    "jinja2>=3.1",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "uvicorn>=0.54",
]

[project.optional-dependencies]
# Dev-only: run the brief through the Claude Agent SDK on the developer's own Claude Code login.
# Never used in production. See docs/adr/0002-dev-only-agent-sdk-summarizer.md.
claude-code = [
    "claude-agent-sdk>=0.2.174",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "respx>=0.23",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wazuh_brief"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
